version: 2

project_name: mbkp

before:
  hooks:
    - go mod tidy

builds:
  - id: mbkp
    main: ./cmd/mbkp
    binary: mbkp
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Matches the Makefile build: the version is injected into the
    # `version` variable of package main (cmd/mbkp/main.go).
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: mbkp
    formats: ["tar.gz"]
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "sha256sums.txt"

changelog:
  # Ask GitHub to generate the release notes (same as
  # generate_release_notes: true on softprops/action-gh-release).
  use: github-native

release:
  name_template: "mbkp {{ .Tag }}"
  # Tags carrying a pre-release suffix (e.g. v1.2.3-rc1) are marked
  # as pre-releases; everything else is a stable release.
  prerelease: auto
