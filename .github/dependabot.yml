version: 2
updates:
    # Go module dependencies (go.mod / go.sum)
    - package-ecosystem: gomod
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "deps"
      groups:
          go-modules:
              patterns:
                  - "*"
      open-pull-requests-limit: 5

    # GitHub Actions used in .github/workflows
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: "ci"
      groups:
          github-actions:
              patterns:
                  - "*"
      open-pull-requests-limit: 5
